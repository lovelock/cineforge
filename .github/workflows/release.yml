name: Release Linux packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-linux:
    name: Build AppImage / deb / rpm / pacman
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-45.2.3-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-45.2.3-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm \
            fakeroot \
            libarchive-tools \
            xz-utils \
            zstd

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const file of ["package.json", "apps/electron/package.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              data.version = version;
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
            }
            console.log("version set to", version);
          '

      - name: Build TypeScript and UI
        run: npm run build

      - name: Package Linux artifacts
        run: npm -w apps/electron run dist:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: ls -lh apps/electron/release

      - name: Generate checksums
        shell: bash
        run: |
          cd apps/electron/release
          : > SHA256SUMS
          while IFS= read -r file; do
            sha256sum "$file" >> SHA256SUMS
          done < <(find . -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.pacman' -o -name '*.pkg.tar.*' \) \
            -printf '%f\n' | sort)
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cineforge-linux-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
            apps/electron/release/*.rpm
            apps/electron/release/*.pacman
            apps/electron/release/*.pkg.tar.*
            apps/electron/release/SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
            apps/electron/release/*.rpm
            apps/electron/release/*.pacman
            apps/electron/release/*.pkg.tar.*
            apps/electron/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
